<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Our Chargers</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <section class="charger-section">
        <h1>Explore<br>our charges</h1>
    <div class="color-options">
      <button class="color-dot selected" aria-label="Asphalt Black"></button>
      <button class="color-dot blue" aria-label="Midnight Blue"></button>
      <button class="color-dot grey" aria-label="Rock Grey"></button>
      <button class="color-dot brown" aria-label="Wood Brown"></button>
      <button class="color-dot white" aria-label="Cloud White"></button>
      <button class="color-dot green" aria-label="Moss Green"></button>
    </div>

        <img src="charger.png" alt="Black electric vehicle charger" class="charger-image" id="chargerImage">
    </section>
    <script src="script.js"></script>
    
</body>
</html>
